version: "3"

tasks:
  dev:
    desc: Run the frontend and backend dev servers together
    deps:
      - dev:backend
      - dev:frontend
      - dev:funnel

  dev:backend:
    internal: true
    dir: backend
    cmds:
      - venv/bin/python manage.py runserver 8000

  dev:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run dev

  dev:funnel:
    desc: Expose the frontend dev server on port 3000 via tailscale funnel
    cmds:
      - tailscale funnel 3000
